name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # The oldest Ubuntu runner: the binary needs glibc 2.34, not 2.39.
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
          - os: macos-15
            platform: macos-arm64
    env:
      # Binaries run on every Apple Silicon Mac, not only on the runner's macOS.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      # Building Spinel runs Ruby, and the oracle needs it too.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Cache Spinel
        id: spinel
        uses: actions/cache@v4
        with:
          path: ~/.spinel
          key: spinel-${{ matrix.os }}-${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('SPINEL_REVISION') }}

      - name: Build Spinel
        if: steps.spinel.outputs.cache-hit != 'true'
        run: .github/scripts/install-spinel.sh ~/.spinel

      - run: echo "$HOME/.spinel/bin" >> "$GITHUB_PATH"

      - run: spin test
      - run: spin build

      - run: gem install bundler-audit -v 0.9.3
      - run: ruby oracle/check_tables.rb
      - run: oracle/run.sh
        env:
          ORACLE_NO_TTY: "1"

      - name: Package
        run: |
          version=${GITHUB_REF_NAME#v}
          name=spinel-bundler-audit-$version-${{ matrix.platform }}
          mkdir "$name"
          cp build/bin/spinel-bundler-audit README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: spinel-bundler-audit-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum spinel-bundler-audit-*.tar.gz > SHA256SUMS

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md." \
            spinel-bundler-audit-*.tar.gz SHA256SUMS
